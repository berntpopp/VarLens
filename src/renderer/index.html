<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VarLens - Offline genetic variant analysis and clinical interpretation"
    />
    <title>VarLens</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1E3A5F" />
    <!-- The app ships a light theme only. Declaring it (plus a pre-mount
         background matching the Vuetify theme's `background`) stops dark-OS
         browsers from painting a dark canvas that flashes to white, then to
         the app's slate background, before Vue mounts. -->
    <meta name="color-scheme" content="light" />
    <style>
      html,
      body {
        margin: 0;
        background: #f0f4f8;
        color: #1a1d23;
        color-scheme: light;
      }
      /* Pre-mount boot state. The main process shows the window before it
         opens the database, so this is what the user sees until Vue mounts
         (mounting replaces the contents of #app). */
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font:
          500 15px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: #3a4250;
      }
      .boot-splash__bar {
        width: 160px;
        height: 3px;
        border-radius: 2px;
        background: #d5dde7;
        overflow: hidden;
      }
      .boot-splash__bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: #1e3a5f;
        animation: boot-splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-splash-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!-- 'unsafe-eval' is REQUIRED by the bundled dependency chain: pdbe-molstar@3.12.0
         statically imports Mol*'s MP4 export, which imports h264-mp4-encoder@1.0.12.
         Its Emscripten web bundle executes new Function("body", ...) in
         createNamedFunction while initializing embind error classes. Dropping
         'unsafe-eval' breaks lazy viewer initialization, so no structure renders.
         Verified by the PR-G G0 real-GPU differential and guarded by
         tests/e2e/csp-molstar-eval.e2e.ts. 'wasm-unsafe-eval' + blob: cover Mol*'s
         WASM and worker/blob data handling. External connect-src entries enable the
         AlphaFold, PDB, gnomAD, UniProt, InterPro structure/annotation APIs.
         Keep this policy IDENTICAL to src/web/index.html (Codex F-08). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' data: https://alphafold.ebi.ac.uk https://www.ebi.ac.uk https://files.rcsb.org https://models.rcsb.org https://data.rcsb.org https://rest.ensembl.org https://gnomad.broadinstitute.org https://www.proteins.uniprot.org https://rest.uniprot.org https://www.interpro.ebi.ac.uk blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
  </head>

  <body>
    <div id="app">
      <div class="boot-splash" role="status" aria-live="polite">
        <span>Opening VarLens…</span>
        <div class="boot-splash__bar" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
