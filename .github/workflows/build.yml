name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Cancel stale in-flight runs on the same PR branch when a new push arrives.
# Gated on pull_request so a push-to-main or release run is never cancelled
# mid-flight. Pattern: https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      web: ${{ steps.filter.outputs.web }}
      docker: ${{ steps.filter.outputs.docker }}
      full: ${{ steps.filter.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Classify shared gate inputs
        id: filter
        run: node scripts/ci/changes.mjs --github-output

  workflows:
    name: Workflow and repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install formatting tools without native compilation
        run: npm ci --ignore-scripts
      - name: Restore formatter cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache@v6.1.0
        with:
          path: .cache/prettier
          key: prettier-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json', '.prettierignore', 'scripts/format.mjs') }}-${{ github.sha }}
          restore-keys: |
            prettier-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json', '.prettierignore', 'scripts/format.mjs') }}-
      - name: Repository hygiene
        run: make format-check agent-check
      - name: Workflow syntax, pinned actions, and shell scripts
        run: node scripts/ci/run.mjs --workflows

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Scan history with checksum-verified Gitleaks
        run: node scripts/ci/tools.mjs gitleaks git --no-banner --redact --report-format sarif --report-path gitleaks-results.sarif --exit-code 1 .

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: gitleaks-results.sarif
          path: gitleaks-results.sarif

  # ── 2. Ubuntu-only fast checks (lint + format + typecheck + test) ──
  # Lint/typecheck/test are deterministic and don't need per-OS runs.
  # Running them three times on the matrix was pure waste. The
  # cross-platform `package` job below still catches OS-specific
  # issues at the compiled-build step.
  checks:
    name: Checks (Ubuntu)
    env:
      VARLENS_NATIVE_RUNTIME: node
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Resolve native toolchain identity
        id: electron-ver
        shell: bash
        run: |
          {
            echo "ver=$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")"
            echo "node-abi=$(node -p 'process.versions.modules')"
            echo "mod=$(node -p "require('./package-lock.json').packages['node_modules/better-sqlite3-multiple-ciphers'].version")"
          } >> "$GITHUB_OUTPUT"

      # Restore the repo-owned ABI-keyed native cache BEFORE npm ci, so
      # postinstall restores a binary instead of compiling one. `.cache/native`
      # is a sibling of node_modules and survives `npm ci`.
      # Path is `.cache/native`, never bare `.cache` — `.cache/tsbuildinfo` is a
      # sibling with a different key. No restore-keys: a partial match is
      # rejected by manifestIsFresh() anyway, and the absence documents intent.
      - name: Restore native ABI cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache@v6.1.0
        with:
          path: .cache/native
          key: native-${{ env.VARLENS_NATIVE_RUNTIME }}-${{ runner.os }}-${{ runner.arch }}-node${{ steps.electron-ver.outputs.node-abi }}-electron${{ steps.electron-ver.outputs.ver }}-mod${{ steps.electron-ver.outputs.mod }}-${{ hashFiles('.nvmrc', 'scripts/native/**') }}

      - name: Install dependencies
        run: npm ci

      # checks runs Vitest under Node, so assert the NODE ABI, not electron.
      - name: Assert native ABI
        run: node scripts/native/assert-native-abi.mjs node

      # Cache TypeScript --incremental build info. Partial restores are fine
      # because tsc/vue-tsc use content hashes inside .tsbuildinfo to decide
      # what to recheck. Pattern per actions/cache#459 discussion.
      - name: Restore tsbuildinfo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache@v6.1.0
        with:
          path: .cache/tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-
            tsbuildinfo-${{ runner.os }}-

      - name: Run linter
        run: make lint-check

      - name: Run type check
        run: make typecheck

      # DbPool integration needs the emitted worker. electron-vite 5 has no
      # supported skipRenderer build flag, so use its complete JS build here.
      # Compilation leaves the native addon on the Node ABI used by Vitest.
      - name: Build fresh worker artifacts for integration tests
        run: |
          rm -rf out/main out/preload out/renderer
          npm run build
          test -s out/main/db-worker.js

      # Coverage only on push-to-main — PRs and manual `workflow_dispatch`
      # reruns (e.g. re-generating installers past the 30-day rerun window)
      # run plain `vitest run` for speed. Gated on "not push" rather than an
      # explicit pull_request/workflow_dispatch OR so a future event type
      # defaults to running tests, not silently skipping them: release.yml
      # selects the newest Build run on a SHA as its "CI passed" gate, so a
      # test step that silently no-ops on some event would let an untested
      # run satisfy that gate.
      - name: Run tests
        if: github.event_name != 'push'
        run: make test

      - name: Run tests with coverage (main)
        if: github.event_name == 'push'
        run: make test-coverage

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage/coverage-summary.json

  # ── 3. Cross-platform compiled-build validation ────────────────────
  # Only runs after `checks` passes. Validates that electron-vite +
  # electron-builder can produce a working artifact on each target OS.
  # Uses `actions/checkout` + `setup-node` fresh on each runner — the
  # Electron-ABI native binary can't be shared with the Ubuntu checks
  # job because it's a different Node environment.
  package:
    name: Package (${{ matrix.os }})
    needs: [changes, checks]
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.draft != true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS legs only build and package; they run no tests. A PR
        # that touches nothing but src/ and tests/ cannot break them in a way the
        # Linux leg misses, so it packages Linux only. Main and manual runs
        # always select `full`, so every release SHA still has all installers.
        include: ${{ fromJSON(needs.changes.outputs.full == 'true' && '[{"os":"ubuntu-latest","platform":"linux"},{"os":"windows-latest","platform":"win"},{"os":"macos-latest","platform":"mac"}]' || '[{"os":"ubuntu-latest","platform":"linux"}]') }}
    # app-builder-lib's getCacheDirectory() (electronGet.js:34-57) only honours
    # ELECTRON_BUILDER_CACHE when it is an ABSOLUTE path (`path.parse(env).root`
    # must be truthy). `${{ github.workspace }}` is absolute on every runner
    # (Windows, macOS, Linux alike), so pinning it here gives one workspace-
    # relative cache path instead of a three-way OS conditional over the
    # default per-OS locations. Set at the job level so both the cache step
    # below and the `Package Electron app` step (which invokes electron-builder
    # itself) see the identical value.
    env:
      VARLENS_NATIVE_RUNTIME: electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

    steps:
      - name: Configure git line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Resolve native toolchain identity
        id: electron-ver
        shell: bash
        run: |
          {
            echo "ver=$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")"
            echo "node-abi=$(node -p 'process.versions.modules')"
            echo "mod=$(node -p "require('./package-lock.json').packages['node_modules/better-sqlite3-multiple-ciphers'].version")"
          } >> "$GITHUB_OUTPUT"

      # Restore the repo-owned ABI-keyed native cache BEFORE npm ci, so
      # postinstall restores a binary instead of compiling one. `.cache/native`
      # is a sibling of node_modules and survives `npm ci`.
      # Path is `.cache/native`, never bare `.cache` — `.cache/tsbuildinfo` is a
      # sibling with a different key. No restore-keys: a partial match is
      # rejected by manifestIsFresh() anyway, and the absence documents intent.
      - name: Restore native ABI cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache@v6.1.0
        with:
          path: .cache/native
          key: native-${{ env.VARLENS_NATIVE_RUNTIME }}-${{ runner.os }}-${{ runner.arch }}-node${{ steps.electron-ver.outputs.node-abi }}-electron${{ steps.electron-ver.outputs.ver }}-mod${{ steps.electron-ver.outputs.mod }}-${{ hashFiles('.nvmrc', 'scripts/native/**') }}

      - name: Install dependencies
        run: npm ci

      - name: Assert native ABI
        shell: bash
        run: node scripts/native/assert-native-abi.mjs electron

      - name: Build Electron app
        run: npx electron-vite build

      - name: Run startup smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npx playwright test tests/e2e/startup-smoke.e2e.ts --workers=1

      # Table interaction-quality gates (audit 2026-10-06 §9): CLS <= 0.02 and
      # INP < 200 ms per case/cohort interaction, one visible-page query per
      # sort, no stale render under a delayed first response. ~35 s on the
      # frozen 3x50-variant fixture; mirrors `make perf-interaction-gates`.
      - name: Run interaction quality gates (Linux)
        if: runner.os == 'Linux'
        run: make perf-interaction-gates

      - name: Upload startup smoke artifacts (Linux)
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: startup-smoke-linux
          path: |
            test-results/
            .planning/artifacts/perf/phase1/baseline/startup-smoke/
            .planning/artifacts/perf/phase1/baseline/interaction-quality/

      # Content-addressed tool archives (nsis-resources, 7zip, winCodeSign, the
      # Electron zip itself, …) re-verified by sha256 on use, so — unlike the
      # native ABI cache above — a partial `restore-keys` match is safe and
      # still saves a download. Path is `.cache/electron-builder`, workspace-
      # relative and matching ELECTRON_BUILDER_CACHE above; never bare `.cache`
      # — `.cache/native` and `.cache/tsbuildinfo` are siblings with different
      # keys and lifetimes.
      - name: Restore electron-builder toolset cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache@v6.1.0
        with:
          path: .cache/electron-builder
          key: ebtools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ebtools-${{ runner.os }}-${{ runner.arch }}-

      # electron-builder's extracted-directory cache tier checks file COUNT,
      # not content (cacheState.js:112-131), so a partial restore would be
      # served silently. The `<extractDir>.state` files are SIBLINGS of the
      # extracted directory, not files inside it (cacheState.js:24 —
      # `${extractDir}.state`), so they must be found and removed explicitly.
      # Dropping them forces re-extraction back through the sha256-verified
      # archive path. Cheap; the download is what is actually being cached.
      - name: Drop electron-builder extraction state so archives are re-verified
        shell: bash
        run: |
          set -euo pipefail
          DIR=".cache/electron-builder"
          [ -d "$DIR" ] || { echo "no electron-builder cache to clean"; exit 0; }
          find "$DIR" -name '*.state' -type f -delete
          find "$DIR" -name '*.lock' -type f -delete
          echo "cleared extraction state under $DIR"

      - name: Package Electron app
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Run packaged smoke (Linux)
        if: runner.os == 'Linux'
        # The packaged Electron binary ships `chrome-sandbox` unpacked; the
        # runtime requires it to be root-owned mode 4755, which GitHub Actions
        # runners do not set up. `VARLENS_E2E_NO_SANDBOX=1` tells the smoke
        # helper to launch with `--no-sandbox`. The fuse baseline under test
        # is unaffected by this flag.
        env:
          VARLENS_E2E_NO_SANDBOX: '1'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npx playwright test tests/e2e/packaged-smoke.e2e.ts --workers=1

      - name: Upload packaged smoke artifacts (Linux)
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: packaged-smoke-linux
          path: |
            test-results/
            .planning/artifacts/perf/phase1/baseline/packaged-smoke/

      # macOS runners ship `shasum` but not `sha256sum`; Git-for-Windows ships
      # coreutils' `sha256sum` but only has `shasum` if Perl is on PATH;
      # Linux has both. Detect whichever is actually present rather than
      # betting on one — both emit the identical `<64 hex> *<name>` binary-mode
      # format (see the -b rationale below) that verify-promoted-artifacts.mjs
      # parses, confirmed locally.
      - name: Write provenance and checksums
        if: github.event_name != 'pull_request'
        shell: bash
        working-directory: release
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # Split assignment from `export` — `export V="$(cmd)"` swallows a
          # failing `cmd`'s exit status (only the bare `V="$(cmd)"` form trips
          # `set -e`), which would otherwise let a failing `node -p` or
          # `git rev-parse` write an empty/wrong value into provenance.json
          # silently. `tree` in particular is never validated downstream, so
          # a silently-empty value would ship unnoticed.
          VERSION="$(node -p "require('../package.json').version")"
          export VERSION
          TREE_SHA="$(git -C .. rev-parse 'HEAD^{tree}')"
          export TREE_SHA
          node -e "
            const fs = require('fs')
            fs.writeFileSync('provenance.json', JSON.stringify({
              sha: process.env.GITHUB_SHA,
              tree: process.env.TREE_SHA,
              run_id: process.env.GITHUB_RUN_ID,
              run_attempt: process.env.GITHUB_RUN_ATTEMPT,
              version: process.env.VERSION,
              os: process.env.RUNNER_OS,
              arch: process.env.RUNNER_ARCH,
              platform: process.env.PLATFORM
            }, null, 2) + '\n')
          "
          # Checksum every publishable asset with -b (binary mode) on both tool
          # branches, in the `<hex> *<name>` form verify-promoted-artifacts.mjs
          # parses. Deliberately excludes provenance.json and SHA256SUMS itself.
          #
          # -b matters specifically for `shasum` on Git-for-Windows: it is a
          # Perl script whose Digest::SHA::addfile only calls binmode() for
          # 'b'/'0' modes, not the default text mode — without -b a CRLF
          # translation on that Perl build could silently corrupt every
          # .exe/.zip digest on the Windows leg. GNU sha256sum's default
          # (text) mode is already binary-equivalent on POSIX, so -b there is
          # a no-op in practice; it is applied to both branches anyway so the
          # two tools always emit the identical asterisk-prefixed form rather
          # than depending on which branch happened to run.
          SUM=$(command -v shasum >/dev/null 2>&1 && echo "shasum -a 256 -b" || echo "sha256sum -b")
          : > SHA256SUMS
          for f in *.AppImage *.deb *.dmg *.exe *.zip latest*.yml; do
            [ -e "$f" ] || continue
            $SUM "$f" >> SHA256SUMS
          done
          # An empty SHA256SUMS means the packaging step produced nothing.
          [ -s SHA256SUMS ] || { echo "::error::no publishable assets found in release/"; exit 1; }
          cat SHA256SUMS

      - name: Upload installers
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: installers-${{ matrix.os }}
          # Installers are already compressed; level 6 burns CPU for nothing.
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
          path: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.exe
            release/*.zip
            release/latest*.yml
            release/provenance.json
            release/SHA256SUMS

  # ── 4. Web-mode required check for web app surfaces ────────────────
  # The only PR web gate; standalone Web CI handles VarLens-Web/manual runs.
  web-ci:
    name: Web CI
    needs: changes
    if: needs.changes.outputs.web == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: varlens_web_ci
          POSTGRES_USER: varlens
          POSTGRES_PASSWORD: varlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U varlens -d varlens_web_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VARLENS_NATIVE_RUNTIME: node
      VARLENS_PG_URL: postgres://varlens:varlens@127.0.0.1:5432/varlens_web_ci
      VARLENS_RECOVERY_KEY_DIR: /tmp/varlens-web-ci-secrets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Resolve native toolchain identity
        id: electron-ver
        shell: bash
        run: |
          {
            echo "ver=$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")"
            echo "node-abi=$(node -p 'process.versions.modules')"
            echo "mod=$(node -p "require('./package-lock.json').packages['node_modules/better-sqlite3-multiple-ciphers'].version")"
          } >> "$GITHUB_OUTPUT"

      # Restore the repo-owned ABI-keyed native cache BEFORE npm ci, so
      # postinstall restores a binary instead of compiling one. `.cache/native`
      # is a sibling of node_modules and survives `npm ci`.
      # Path is `.cache/native`, never bare `.cache` — `.cache/tsbuildinfo` is a
      # sibling with a different key. No restore-keys: a partial match is
      # rejected by manifestIsFresh() anyway, and the absence documents intent.
      - name: Restore native ABI cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache@v6.1.0
        with:
          path: .cache/native
          key: native-${{ env.VARLENS_NATIVE_RUNTIME }}-${{ runner.os }}-${{ runner.arch }}-node${{ steps.electron-ver.outputs.node-abi }}-electron${{ steps.electron-ver.outputs.ver }}-mod${{ steps.electron-ver.outputs.mod }}-${{ hashFiles('.nvmrc', 'scripts/native/**') }}

      - name: Install dependencies
        run: npm ci

      # `make web-ci` runs the web gate under Node (no Electron process
      # involved), so assert the NODE ABI, not electron.
      - name: Assert native ABI
        run: node scripts/native/assert-native-abi.mjs node

      - name: Run opt-in web gate
        run: make web-ci

      # UI quality gates (audit 2026-10-06 §9): axe on 5 key states x light/dark
      # and Lighthouse desktop budgets against the root-mounted web build.
      # `make web-ci` above already built the root-mounted bundle they run against.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Lighthouse launches its own Chrome (without Playwright's --no-sandbox);
      # Ubuntu 24.04 runners restrict unprivileged user namespaces via AppArmor,
      # so Chrome's sandbox fails with "No usable sandbox!". Same fix as docs.yml.
      - name: Allow Chrome to use unprivileged user namespaces (Ubuntu 24.04)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run UI quality gates (axe + Lighthouse)
        run: make ui-gates

      - name: Upload UI gate reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: ui-gates
          path: test-results/ui-gates/
          if-no-files-found: ignore

  docker:
    name: Docker runtime and security
    needs: changes
    if: needs.changes.outputs.docker == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Set up bounded Docker builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # docker/setup-buildx-action@v4.4.1
        with:
          driver: docker-container
          driver-opts: |
            memory=6g
            memory-swap=6g
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Build runtime image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # docker/build-push-action@v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: varlens-web-ci
          cache-from: |
            type=gha,scope=web-main
            type=gha,scope=web-${{ github.ref_name }}
          # PRs read main's layers and write none: a PR-scoped copy cost 23 s and
          # ~150 MB per run, and pushed the repository over its 10 GB cache quota.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope=web-{0}', github.ref_name) || '' }}
      - name: Runtime smoke against disposable PostgreSQL
        run: node scripts/ci/containers.mjs smoke varlens-web-ci
      - name: Trivy 0.70.0 critical fixed-vulnerability gate
        run: node scripts/ci/containers.mjs scan varlens-web-ci

  # Stable required check: selected lanes must report success, including cancellation.
  ci:
    name: CI
    needs: [changes, secrets-scan, workflows, checks, package, web-ci, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Compute overall result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/workflow-policy.mjs aggregate
