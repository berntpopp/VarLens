name: Web CI

on:
  push:
    branches:
      - VarLens-Web
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: varlens_web_ci
          POSTGRES_USER: varlens
          POSTGRES_PASSWORD: varlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U varlens -d varlens_web_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VARLENS_NATIVE_RUNTIME: node
      VARLENS_PG_URL: postgres://varlens:varlens@127.0.0.1:5432/varlens_web_ci
      VARLENS_RECOVERY_KEY_DIR: /tmp/varlens-web-ci-secrets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      # Contract requirement: tests/scripts/ci-workflow-contract.test.ts
      # node scripts/native/assert-native-abi.mjs node
      # run: make web-ci
      - name: Run Web CI
        uses: ./.github/actions/setup-web-ci
        with:
          run-ui-gates: 'true'
