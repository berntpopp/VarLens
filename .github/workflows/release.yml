name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  create-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read # gh run list / gh api .../artifacts read another workflow's runs
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      version: ${{ steps.version.outputs.version }}
      build_run_id: ${{ steps.build-gate.outputs.build_run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Closes the force-moved-tag hole: refuses to release if the tag was
      # moved to point at a different commit after this run started resolving
      # refs/tags/*. The checkout above already uses fetch-depth: 0.
      - name: Assert tag ref resolves to the commit being released
        run: |
          set -euo pipefail
          TAG_COMMIT=$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")
          if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} now resolves to $TAG_COMMIT but this run is for $GITHUB_SHA."
            echo "::error::The tag was moved after this workflow started. Refusing to publish a mismatched release."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} resolves to $GITHUB_SHA"

      - name: Assert tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $TAG_VERSION but package.json reports $PKG_VERSION"
            echo "::error::Bump package.json to match the tag (or retag) before releasing."
            exit 1
          fi
          echo "Tag and package.json agree on $PKG_VERSION"

      # Belt-and-suspenders gate: refuse to release a tag whose SHA didn't
      # pass the Build workflow. Branch protection already blocks merges on failing
      # CI, but direct tag pushes bypass branch protection — this catches
      # that case before any OS builder spins up and wastes runner minutes.
      # Tags don't trigger the Build workflow (it only runs on push-to-main
      # and PRs), so we look up the latest Build run on the exact tagged commit.
      #
      # IMPORTANT: annotated tags (`git tag -a`) have their own tag object;
      # `git rev-parse v0.55.0` returns that tag object's SHA, not the commit
      # it points to. Use `${GITHUB_SHA}` (which Actions always sets to the
      # underlying commit SHA for tag pushes) so the lookup hits the actual
      # Build run that CI executed. Previous bug: released 0.55.0 failed
      # with "got: missing" because `gh run list --commit=<tag-object-sha>`
      # returned an empty array.
      # Poll for Build completion instead of a single-shot check.
      # When a release commit is pushed to main AND tagged in quick
      # succession, Build triggers on the main push but may not
      # finish before release.yml reaches this step. Without retry
      # logic the check finds no "success" conclusion and fails
      # (race condition that broke v0.56.1's first release attempt).
      - name: Verify Build workflow passed on tagged SHA
        id: build-gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          MAX_ATTEMPTS=20
          DELAY=30
          for i in $(seq 1 $MAX_ATTEMPTS); do
            # `--commit` with a SHORT sha silently returns []; GITHUB_SHA is always full.
            # Accept push and workflow_dispatch; exclude pull_request, whose head_sha
            # is the PR HEAD and whose runs never upload installers.
            RUN=$(gh run list --workflow="Build" --commit="$SHA" --limit 20 \
              --json conclusion,databaseId,headSha,event \
              --jq "[.[] | select(.headSha == \"$SHA\") | select(.event == \"push\" or .event == \"workflow_dispatch\")] | .[0] // empty")
            STATUS=$(echo "$RUN" | jq -r '.conclusion // "pending"')
            # `echo "$RUN" | jq ...` on a genuinely empty $RUN (the `// empty`
            # case, no matching run found yet) processes zero JSON values and
            # produces an empty string rather than jq's own "pending"
            # fallback — normalize it here so the poll log below is accurate.
            STATUS="${STATUS:-pending}"
            if [ "$STATUS" = "success" ]; then
              RUN_ID=$(echo "$RUN" | jq -r '.databaseId')
              # A "success" Build run can still be missing installer artifacts
              # if its package job was skipped (e.g. changes.outputs.code was
              # false — not reachable for a real release commit since
              # package.json is in the code filter, but this fails closed
              # either way). Without this check the failure only surfaces one
              # job later as an opaque "Unable to find an artifact with the
              # name installers-<os>" from actions/download-artifact.
              # `--paginate` is required: the REST endpoint returns 30
              # artifacts per page by default, and a run can produce more
              # than that. `--jq` under `--paginate` runs once per page
              # rather than merging pages first, so `[.artifacts[].name]`
              # would print one JSON array per page instead of one combined
              # array — using the flat `.artifacts[].name` form instead
              # prints one name per line across all pages, which a plain
              # line-match below can check without needing to merge JSON.
              ARTIFACT_NAMES=$(gh api --paginate "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[].name')
              for NAME in installers-ubuntu-latest installers-macos-latest installers-windows-latest; do
                if ! grep -qxF "$NAME" <<< "$ARTIFACT_NAMES"; then
                  echo "::error::Build run $RUN_ID succeeded but has no '$NAME' artifact — its package job likely didn't run. Refusing to promote a partial artifact set."
                  exit 1
                fi
              done
              echo "build_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "Build passed on $SHA in run $RUN_ID — promoting its artifacts"
              exit 0
            elif [ "$STATUS" = "failure" ] || [ "$STATUS" = "cancelled" ]; then
              echo "::error::Build did not succeed on $SHA (got: $STATUS). Refusing to release."
              exit 1
            fi
            echo "Build status: $STATUS (attempt $i/$MAX_ATTEMPTS, waiting ${DELAY}s...)"
            sleep $DELAY
          done
          echo "::error::Build did not complete within $((MAX_ATTEMPTS * DELAY))s on $SHA"
          exit 1

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since ${PREV_TAG}" > release_notes.md
            echo "" >> release_notes.md
            git log "${PREV_TAG}..${RELEASE_TAG}" --pretty=format:"- %s" --no-merges >> release_notes.md || true
          else
            echo "Initial release" > release_notes.md
          fi

      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          BODY=$(cat release_notes.md)
          RELEASE_ID=$(gh api "repos/${REPO}/releases" \
            -f tag_name="${RELEASE_TAG}" \
            -f name="${RELEASE_TAG}" \
            -f body="$BODY" \
            -F draft=true \
            -F prerelease=false \
            --jq '.id')
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Scan history with checksum-verified Gitleaks
        run: node scripts/ci/tools.mjs gitleaks git --no-banner --redact --report-format sarif --report-path gitleaks-results.sarif --exit-code 1 .

  promote-unix:
    name: Promote Linux + macOS installers
    needs: [create-release, secrets-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # required to read another workflow run's artifacts
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Download Linux installers from the verified Build run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact@v8.0.1
        with:
          name: installers-ubuntu-latest
          path: promoted/linux
          run-id: ${{ needs.create-release.outputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download macOS installers from the verified Build run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact@v8.0.1
        with:
          name: installers-macos-latest
          path: promoted/mac
          run-id: ${{ needs.create-release.outputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify promoted artifacts
        run: |
          set -euo pipefail
          V="${{ needs.create-release.outputs.version }}"
          node scripts/release/verify-promoted-artifacts.mjs promoted/linux linux "$V" "$GITHUB_SHA"
          node scripts/release/verify-promoted-artifacts.mjs promoted/mac   mac   "$V" "$GITHUB_SHA"

      - name: Verify auto-update metadata
        run: |
          set -euo pipefail
          node scripts/release/verify-latest-yml.mjs promoted/linux/latest-linux.yml promoted/linux
          node scripts/release/verify-latest-yml.mjs promoted/mac/latest-mac.yml     promoted/mac

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: release-linux
          compression-level: 0
          if-no-files-found: error
          path: |
            promoted/linux/*.AppImage
            promoted/linux/*.deb
            promoted/linux/latest-linux.yml

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: release-macos
          compression-level: 0
          if-no-files-found: error
          path: |
            promoted/mac/*.dmg
            promoted/mac/*.zip
            promoted/mac/latest-mac.yml

  sign-windows:
    name: Sign Windows executables
    needs: [create-release, secrets-scan]
    runs-on: windows-latest
    timeout-minutes: 40
    environment: release
    permissions:
      contents: read
      actions: read # required to read another workflow run's artifacts
    outputs:
      # 'true' only when the eSigner steps ran; consumed by publish-release so
      # the publishing job's summary states the signing status too.
      signed: ${{ steps.signing-status.outputs.signed }}
    env:
      VERSION: ${{ needs.create-release.outputs.version }}
      # The signing hook is the only signer; electron-builder must not go
      # looking for a certificate of its own.
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Download Windows installers from the verified Build run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact@v8.0.1
        with:
          name: installers-windows-latest
          path: promoted/win
          run-id: ${{ needs.create-release.outputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Verifies build.yml's unsigned output — including the zip that carries
      # the unpacked app directory the signed installers are re-wrapped around.
      # Has to run before signing: nothing downstream is trusted until the
      # promoted bytes match the manifest build.yml wrote for this exact SHA.
      - name: Verify promoted artifacts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/verify-promoted-artifacts.mjs promoted/win win "$VERSION" "$GITHUB_SHA"

      # --- Sign every Windows executable (issue #365) -----------------------
      # Design and signature budget:
      # .planning/specs/2026-10-06-windows-sign-all-executables.md
      #
      # Signing only the two outer installers left the app executable, the
      # elevate helper and the uninstaller they install unsigned. Each layer
      # embeds the previous one, so the layers are signed inside-out and the
      # installers are re-wrapped (`electron-builder --prepackaged` — no
      # rebuild, no pack step, fuses untouched) around the signed app.
      # scripts/release/rewrap-windows.mjs owns the sequence and proves the
      # result. Cost: 5 signatures per release from the 20/month eSigner quota.
      #
      # Every step is gated on ESIGNER_ENABLED: the kill switch. With it off,
      # build.yml's installers are published exactly as built (see "Stage
      # unsigned installers").

      # --ignore-scripts: the re-wrap needs electron-builder, not a compiled
      # native module or an Electron download, and no dependency lifecycle
      # script should run in the job that holds the signing credentials.
      - name: Install packaging dependencies
        if: vars.ESIGNER_ENABLED == 'true'
        run: npm ci --ignore-scripts

      - name: Create a throwaway certificate for the signing rehearsal
        if: vars.ESIGNER_ENABLED == 'true'
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject 'CN=VarLens signing rehearsal (NOT A RELEASE)' `
            -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1)
          "VARLENS_SELFSIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      # The whole pipeline, on this runner, on this release's bytes, with a
      # certificate that costs nothing: extraction, the hook's call sequence,
      # the NSIS re-wrap, latest.yml, and every verification below. A paid
      # signature is only spent once all of that has been seen to work. The
      # rehearsal output never leaves RUNNER_TEMP.
      - name: Rehearse signing and re-wrap (no quota)
        if: vars.ESIGNER_ENABLED == 'true'
        shell: bash
        env:
          VARLENS_WINDOWS_SIGNING: selfsigned
        run: |
          set -euo pipefail
          node scripts/release/rewrap-windows.mjs --promoted promoted/win --version "$VERSION" \
            --out "$RUNNER_TEMP/rehearsal/out" --work "$RUNNER_TEMP/rehearsal/work" \
            --report "$RUNNER_TEMP/rehearsal/executables.json"

      - name: Rehearse the Authenticode assertion
        if: vars.ESIGNER_ENABLED == 'true'
        shell: pwsh
        run: ./scripts/release/assert-authenticode.ps1 -Report "$env:RUNNER_TEMP/rehearsal/executables.json" -Rehearsal

      - name: Discard the rehearsal certificate
        if: always() && vars.ESIGNER_ENABLED == 'true'
        shell: pwsh
        run: |
          if ($env:VARLENS_SELFSIGN_THUMBPRINT) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:VARLENS_SELFSIGN_THUMBPRINT" -DeleteKey -ErrorAction SilentlyContinue
          }

      # Uses CodeSignTool v1.3.2 jar directly (not the buggy GitHub Action).
      - name: Setup Java for CodeSignTool
        if: vars.ESIGNER_ENABLED == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # actions/setup-java@v6.0.1
        with:
          distribution: corretto
          java-version: '11'

      - name: Download and configure CodeSignTool
        if: vars.ESIGNER_ENABLED == 'true'
        shell: pwsh
        run: |
          $csVersion = "v1.3.2"
          $expectedHash = "4afc32e8b7f79bbe1de7e4e7049aaad4e0f754357613b9bbec0e3052f06fd36b"
          $url = "https://github.com/SSLcom/CodeSignTool/releases/download/$csVersion/CodeSignTool-$csVersion-windows.zip"
          Invoke-WebRequest -Uri $url -OutFile codesigntool.zip
          $actualHash = (Get-FileHash -Path codesigntool.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "CodeSignTool checksum mismatch! Expected $expectedHash but got $actualHash"
          }
          Expand-Archive -Path codesigntool.zip -DestinationPath codesigntool -Force
          # Zip extracts flat: codesigntool/jar/, codesigntool/conf/, etc.
          # Find the root by locating the jar file
          $jarFile = Get-ChildItem codesigntool -Recurse -Filter "code_sign_tool-*.jar" | Select-Object -First 1
          if (-not $jarFile) { throw "CodeSignTool jar not found after extraction" }
          # The CodeSignTool root is two levels up from jar/code_sign_tool-*.jar
          $cstDir = (Split-Path (Split-Path $jarFile.FullName))
          # Write production config (CodeSignTool reads ./conf/ relative to CWD)
          $conf = Join-Path $cstDir "conf" "code_sign_tool.properties"
          $content = "CLIENT_ID=kaXTRACNijSWsFdRKg_KAfD3fqrBlzMbWs6TwWHwAn8`nOAUTH2_ENDPOINT=https://login.ssl.com/oauth2/token`nCSC_API_ENDPOINT=https://cs.ssl.com`nTSA_URL=http://ts.ssl.com`nTSA_LEGACY_URL=http://ts.ssl.com/legacy"
          Set-Content $conf $content -NoNewline
          Write-Host "CodeSignTool dir: $cstDir"
          Write-Host "Jar: $($jarFile.FullName)"
          Write-Host "Config: $conf"
          Get-Content $conf
          # Verify structure
          Get-ChildItem $cstDir -Exclude __MACOSX | Format-Table Name, Mode
          # Export for next steps
          echo "CST_DIR=$cstDir" >> $env:GITHUB_ENV
          echo "CST_JAR=$($jarFile.FullName)" >> $env:GITHUB_ENV

      # The only step that spends eSigner quota: 5 signatures (app executable,
      # elevate helper, uninstaller, installer, portable), one CodeSignTool
      # `sign` call each. `batch_sign` cannot be used — the files do not exist
      # at the same time — so the calls are spaced one TOTP step apart instead
      # (a one-time password cannot be replayed). Credentials reach the script
      # through the environment and are redacted from any tool output.
      - name: Sign every Windows executable and re-wrap the installers
        if: vars.ESIGNER_ENABLED == 'true'
        shell: bash
        env:
          VARLENS_WINDOWS_SIGNING: esigner
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          set -euo pipefail
          node scripts/release/rewrap-windows.mjs --promoted promoted/win --version "$VERSION" \
            --out publish/win --work "$RUNNER_TEMP/signing/work"

      # Kill-switch path: pure promotion, byte for byte what build.yml built.
      - name: Stage unsigned installers
        if: vars.ESIGNER_ENABLED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish/win
          cp "promoted/win/Varlens-Setup-${VERSION}.exe" "promoted/win/Varlens-Portable-${VERSION}.exe" \
            promoted/win/latest.yml publish/win/

      # Runs unconditionally, on what will be uploaded: latest.yml must
      # describe the shipped bytes whether or not signing ran. On the signing
      # path electron-builder wrote it after the installer's last byte change;
      # this proves it.
      - name: Verify auto-update metadata matches the shipped binaries
        shell: bash
        run: node scripts/release/verify-latest-yml.mjs publish/win/latest.yml publish/win

      # Independent of the signing step: re-opens the staged files from
      # scratch — each installer, then the app archive inside it — and lists
      # every executable. With signing enabled an unsigned executable anywhere
      # is fatal; with it disabled this only produces the report. Either way
      # each installer's payload must be the promoted build's app, file for file.
      - name: Inspect every executable in every Windows artifact
        shell: bash
        env:
          REQUIRE_SIGNED: ${{ vars.ESIGNER_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          ARGS=(--dir publish/win --version "$VERSION" --work "$RUNNER_TEMP/inspect"
            --transport "promoted/win/Varlens-Setup-${VERSION}.zip"
            --report "$RUNNER_TEMP/windows-executables.json"
            --markdown "$RUNNER_TEMP/windows-executables.md")
          if [ "$REQUIRE_SIGNED" = "true" ]; then ARGS+=(--require-signed); fi
          node scripts/release/verify-windows-signatures.mjs "${ARGS[@]}"

      # The Windows-native check, on every executable the step above found —
      # the installers and everything inside them. `-ne 'NotSigned'` rather
      # than `-eq 'Valid'`: see scripts/release/assert-authenticode.ps1.
      - name: Assert an Authenticode signature on every shipped executable
        if: vars.ESIGNER_ENABLED == 'true'
        shell: pwsh
        run: ./scripts/release/assert-authenticode.ps1 -Report "$env:RUNNER_TEMP/windows-executables.json"

      # Visibility (issue #365, gap 1). The ESIGNER_ENABLED gate above is
      # deliberate — it conserves the 20/month eSigner quota — but skipping it
      # used to be silent: a fully green run published unsigned installers that
      # were indistinguishable from signed ones. This step never fails the job
      # and never changes what is shipped; it only makes the outcome loud.
      # SIGNING_RAN evaluates the exact expression the signing steps are gated
      # on, so the report cannot drift from what actually ran.
      - name: Report Windows signing status
        id: signing-status
        shell: bash
        env:
          SIGNING_RAN: ${{ vars.ESIGNER_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          echo "signed=${SIGNING_RAN}" >> "$GITHUB_OUTPUT"
          TABLE=$(cat "$RUNNER_TEMP/windows-executables.md")
          if [ "$SIGNING_RAN" = "true" ]; then
            {
              echo "### Windows code signing: signed"
              echo
              echo "Every executable in every Windows artifact was signed with SSL.com eSigner (5 signatures) and checked for an Authenticode signature:"
              echo
              echo "$TABLE"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          shopt -s nullglob
          UNSIGNED=(publish/win/*.exe)
          UNSIGNED=("${UNSIGNED[@]##*/}")
          echo "::warning title=Unsigned Windows release::${GITHUB_REF_NAME} ships UNSIGNED Windows artifacts (${UNSIGNED[*]}): code signing was skipped because the ESIGNER_ENABLED repository variable is not 'true'."
          {
            echo "### :warning: Windows code signing: SKIPPED — unsigned artifacts"
            echo
            echo "The \`ESIGNER_ENABLED\` repository variable is not \`true\`, so every eSigner step was skipped."
            echo "These Windows artifacts of \`${GITHUB_REF_NAME}\` are **not code-signed** and are published as build.yml built them:"
            echo
            echo "$TABLE"
            echo
            echo "Users will see SmartScreen / unknown-publisher warnings. To ship a signed build, set \`ESIGNER_ENABLED\` to \`true\` and release a new tag."
          } >> "$GITHUB_STEP_SUMMARY"

      # The promoted zip is build.yml's transport for the unpacked app
      # directory, not a release asset: nothing consumes a Windows zip (the
      # updater uses the installer, the docs list installer and portable), and
      # publishing it is what shipped an unsigned Varlens.exe (issue #365, gap 2).
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: release-windows
          compression-level: 0
          if-no-files-found: error
          path: |
            publish/win/*.exe
            publish/win/latest.yml

  publish-release:
    name: Publish Release
    needs: [create-release, promote-unix, sign-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # Single `gh release upload` call instead of a shell for-loop —
      # `gh` parallelises internally and a single invocation also avoids
      # N separate auth handshakes.
      - name: Upload all assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/* --clobber

      # Last correctable moment: refuse to flip the release public if the tag
      # moved during the promote/sign jobs above.
      - name: Re-assert tag ref before publishing
        run: |
          set -euo pipefail
          git fetch --tags --force
          TAG_COMMIT=$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")
          if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} moved to $TAG_COMMIT during the release; assets are from $GITHUB_SHA."
            exit 1
          fi

      - name: Publish draft release and mark as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          gh api -X PATCH "repos/${GH_REPO}/releases/${RELEASE_ID}" \
            -F draft=false \
            -F make_latest=true

      # Runs after the release is public so the summary describes what was
      # actually published (issue #365, gap 1). Anything other than an explicit
      # 'true' from the signing job is reported as unsigned. Visibility only:
      # this step never fails the job.
      - name: Summarize published release and Windows signing status
        env:
          WINDOWS_SIGNED: ${{ needs.sign-windows.outputs.signed }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd artifacts
          if [ "$WINDOWS_SIGNED" = "true" ]; then
            {
              echo "### Published ${GITHUB_REF_NAME}"
              echo
              echo "Windows installers are code-signed, and so is every executable inside them (app, elevate helper, uninstaller):"
              echo
              for f in Varlens-Setup-*.exe Varlens-Portable-*.exe; do
                echo "- \`${f}\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          UNSIGNED=(Varlens-Setup-*.exe Varlens-Portable-*.exe)
          echo "::warning title=Unsigned Windows release published::${GITHUB_REF_NAME} was published with UNSIGNED Windows artifacts (${UNSIGNED[*]}): the ESIGNER_ENABLED repository variable is not 'true'."
          {
            echo "### :warning: Published ${GITHUB_REF_NAME} with UNSIGNED Windows artifacts"
            echo
            echo "Code signing was skipped (\`ESIGNER_ENABLED\` is not \`true\`). These published release assets, and the executables inside them, are **not code-signed**:"
            echo
            for f in "${UNSIGNED[@]}"; do
              echo "- \`${f}\`"
            done
            echo
            echo "To replace them with signed builds, set \`ESIGNER_ENABLED\` to \`true\` and release a new tag."
          } >> "$GITHUB_STEP_SUMMARY"
