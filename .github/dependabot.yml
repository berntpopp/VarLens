# Dependabot configuration for automated dependency updates
# See https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "berntpopp"
    assignees:
      - "berntpopp"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    # Batch minor/patch versions in draft PRs; readiness still runs complete CI.
    # Security fixes use separate groups; native/Electron changes stay reviewable.
    groups:
      production-security:
        applies-to: security-updates
        dependency-type: production
        exclude-patterns: ["electron", "better-sqlite3-multiple-ciphers"]
      development-security:
        applies-to: security-updates
        dependency-type: development
        exclude-patterns: ["electron", "better-sqlite3-multiple-ciphers"]
      production-dependencies:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Ignore specific packages if needed
    ignore:
      # better-sqlite3-multiple-ciphers updates require careful testing due to native bindings
      - dependency-name: "better-sqlite3-multiple-ciphers"
        update-types: ["version-update:semver-major"]
      # Electron major updates need manual migration
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]

  # Enable security updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    # Keep SHA-pinned workflow actions current; same-line tag comments in
    # workflow `uses:` entries let Dependabot update the pin cleanly.
    schedule:
      interval: "weekly"
    labels:
      - "github-actions"
      - "dependencies"
